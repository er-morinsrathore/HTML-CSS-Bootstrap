<!DOCTYPE html>

<html>
<head>
    <title>Zomato Style Card</title>
    
<style>
    .card {
        border: 1px solid #ccc;
        padding: 15px;
        margin: 20px;
        width: 250px;
        font-family: Arial;
    }

    .card h3 {
        margin-bottom: 5px;
    }

    .card p {
        margin: 5px 0;
    }

    .rating {
        margin-top: 10px;
        padding: 5px;
        border: 1px solid #ddd;
    }
</style>

</head>

<body>

<div class="card">
    <h3>Tinello</h3>
    <p>Cuisine: Italian</p>
    <div class="rating">
        Rating: 4.9/5
    </div>
</div>

</body>
</html>
