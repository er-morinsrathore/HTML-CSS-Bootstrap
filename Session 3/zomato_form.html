<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session 3</title>
  </head>
  <body>
    <h1>Zomato Style Food Order Form</h1>
    <form method = "post" action="">
      <label for="uname">Username: </label>
      <input type="text" id="uname" required  maxlength="10">
      <br>
      <br>
          <label for="idz">Order  ID </label>
          <select name="idz" id="idz" required>
          <option value="" disabled selected hidden><strong><em>ORD12345</em></strong></option>
          </select>
          <!--Dropdown 1-->
          <label for="item">Food Item </label>
          <select name="item" id="item" required>
          <option value="" disabled selected hidden><strong><em>Select</em></strong></option>
          <option value="1">Rice</option>
          <option value="2">Pasta</option>
          <option value="3">Noodles</option>
          <option value="4">Pastry</option>
          <option value="5">Cake</option>
        </select>
          <!--Dropdown 2-->
          <label for="rating">Quantity</label>
          <select name="rating" id="rating" required>
          <option value="" disabled selected hidden><strong><em>Select</em></strong></option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <br>
        <br>
        <label for = "inst">Delivery Instructions: </label> <br>
        <textarea name = "inst" id = "inst" required minength = "20"> </textarea>
        <br>
        <input type="submit">


      
    </form>
  </body>
</html>
