<!DOCTYPE html>

<html>
<head>
    <title>Flipkart Style Product Card</title>
<style>
    .offer-banner {
        font-family: Arial, sans-serif;
        color: white;
        background-color: green;
        padding: 10px;
        text-align: center;
        margin-bottom: 10px;
    }
</style>

</head>

<body>

<div class="offer-banner">
    Special Offer: 20% OFF
</div>

<div style="width: 250px; border: 1px solid #ccc; padding: 15px; border-radius: 8px;">

<img src="./product.jpg" alt="Product Image" width="100%">

<h2 style="background-color: #e0f7fa; font-size: 22px;">
    Wireless Headphones
</h2>

<p>High-quality sound with noise cancellation.</p>
</div>

</body>
</html>
