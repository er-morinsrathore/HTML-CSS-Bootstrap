<!DOCTYPE html>

<html>
<head>
    <title>BookMyShow Movie Page</title>
<style>
    body {
        font-family: Arial;
        margin: 0;
        background-color: white;
        color: black;
        text-align: center;
    }

    header {
        padding: 20px;
        border-bottom: 1px solid #ccc;
    }

    .movie {
        padding: 20px;
    }

    button {
        padding: 10px 15px;
        margin: 20px;
        cursor: pointer;
    }

    body.dark-mode {
        background-color: #121212;
        color: white;
    }

    body.dark-mode header {
        border-bottom: 1px solid #444;
    }
</style>

</head>

<body>

<header>
    <h1>Inception</h1>
    <button onclick="toggleMode()">Toggle Light/Dark Mode</button>
</header>

<div class="movie">
    <img src="./inception.jpg" alt="Inception Poster" width="250">
    <p>A mind-bending thriller directed by Christopher Nolan.</p>
</div>

<script>
    function toggleMode() {
        document.body.classList.toggle("dark-mode");
    }
</script>

</body>
</html>
