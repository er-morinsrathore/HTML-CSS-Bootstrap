<!DOCTYPE html>

<html> 
    <head> 
        <title>Theme Switcher</title> 
        <meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div id="main" class="container mt-4 bg-light text-dark p-4">

<button class="btn btn-secondary mb-3" onclick="toggleTheme()">Toggle Theme</button>

<h3>Welcome</h3>
<p>This is a sample page.</p>

</div>

<script> function toggleTheme() 
{ let el = document.getElementById("main"); 
el.classList.toggle("bg-light"); 
el.classList.toggle("bg-dark"); 
el.classList.toggle("text-dark"); 
el.classList.toggle("text-light"); 
} 
</script>

</body> </html>
