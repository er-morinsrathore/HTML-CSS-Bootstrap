<!DOCTYPE html>

<html>
<head>
    <title>Bootstrap Product Cards</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">
    <div class="row">

    <div class="col-md-4">
        <div class="card">
            <img src="./p1.jpg" class="card-img-top" alt="Product 1">
            <div class="card-body">
                <h5 class="card-title">Product 1</h5>
                <p class="card-text">₹999</p>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card">
            <img src="./p2.jpg" class="card-img-top" alt="Product 2">
            <div class="card-body">
                <h5 class="card-title">Product 2</h5>
                <p class="card-text">₹1499</p>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card">
            <img src="./p3.jpg" class="card-img-top" alt="Product 3">
            <div class="card-body">
                <h5 class="card-title">Product 3</h5>
                <p class="card-text">₹1999</p>
            </div>
        </div>
    </div>

</div>
</div>

</body>
</html>
