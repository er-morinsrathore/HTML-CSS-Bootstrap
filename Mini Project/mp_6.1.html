<!DOCTYPE html>

<html> <head> <title>Music Links Form</title> <meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    .card { margin-top: 10px; }
</style>

</head>

<body>

<div class="container mt-4">

<h3>Music Links</h3>

<form id="musicLinksForm">
    <input type="text" id="spotify" class="form-control mb-2" placeholder="Spotify URL">
    <input type="text" id="youtube" class="form-control mb-2" placeholder="YouTube Music URL">
    <input type="text" id="apple" class="form-control mb-2" placeholder="Apple Music URL">

    <button type="button" class="btn btn-primary" onclick="showLinks()">Submit</button>
</form>

<div id="output"></div>

</div>

<script> function showLinks() { let s = document.getElementById("spotify").value; let y = document.getElementById("youtube").value; let a = document.getElementById("apple").value; let output = document.getElementById("output"); output.innerHTML = ""; if(s) output.innerHTML += "<div class='card p-2'>Spotify: " + s + "</div>"; if(y) output.innerHTML += "<div class='card p-2'>YouTube: " + y + "</div>"; if(a) output.innerHTML += "<div class='card p-2'>Apple: " + a + "</div>"; } </script>

</body> </html>
