<!DOCTYPE html>

<html> <head> <title>Input Icons</title> <style> .input-box { padding-left: 40px; height: 35px; margin-bottom: 10px; }

    .icon {
        position: absolute;
        margin: 8px;
    }

    .wrapper {
        position: relative;
    }
</style>

</head>

<body>

<div class="wrapper"> <img src="./instagram.png" class="icon" width="20"> <input type="text" class="input-box" placeholder="Instagram"> </div>

<div class="wrapper"> <img src="./linkedin.png" class="icon" width="20"> <input type="text" class="input-box" placeholder="LinkedIn"> </div>

</body> </html>
