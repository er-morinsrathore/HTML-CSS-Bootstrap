<!DOCTYPE html>

<html>
<head>
    <title>Playlist</title>
<style>
    .playlist {
        display: flex;
        gap: 15px;
        padding: 20px;
    }

    .card {
        display: flex;
        align-items: center;
        border: 1px solid #ccc;
        padding: 10px;
        width: 180px;
    }
</style>

</head>

<body>

<div class="playlist">

<div class="card">Song 1 - Artist A</div>
<div class="card">Song 2 - Artist B</div>
<div class="card">Song 3 - Artist C</div>
<div class="card">Song 4 - Artist D</div>
<div class="card">Song 5 - Artist E</div>

</div>

</body>
</html>
